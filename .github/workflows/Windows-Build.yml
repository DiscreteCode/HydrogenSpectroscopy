name: Windows Build

# Authoritative Windows build/verification path for this project.
# PyInstaller produces platform-native executables and cannot
# cross-compile a Windows .exe from Linux/macOS, so this workflow --
# running on an actual windows-latest runner -- is how the Windows
# build is verified. See docs/RELEASE_CHECKLIST.md.
#
# The uploaded artifact is the COMPLETE onedir folder. GitHub zips every
# artifact itself into a standard, unencrypted .zip (no password): download
# it, extract it, and run HydrogenSpectroscopy/HydrogenSpectroscopy.exe.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen   # tests and smoke tests need no display

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite
        run: python -m pytest -q

      - name: Build with PyInstaller
        run: pyinstaller HydrogenSpectroscopy.spec --noconfirm

      - name: Verify executable was produced
        shell: pwsh
        run: |
          $exe = "dist/HydrogenSpectroscopy/HydrogenSpectroscopy.exe"
          if (-not (Test-Path $exe)) {
            Write-Error "Expected executable not found at $exe"
            exit 1
          }
          Write-Host "Found: $exe"

      - name: Smoke-test the built executable
        shell: pwsh
        run: |
          $result = Join-Path $PWD "smoke_built.txt"
          $p = Start-Process -FilePath "dist/HydrogenSpectroscopy/HydrogenSpectroscopy.exe" `
               -ArgumentList "--smoke-test", "`"$result`"" -Wait -PassThru
          if (Test-Path $result) { Get-Content $result }
          if ($p.ExitCode -ne 0) { Write-Error "Smoke test failed (exit $($p.ExitCode))"; exit 1 }
          if (-not (Select-String -Path $result -Pattern "SMOKE TEST PASSED" -Quiet)) {
            Write-Error "Smoke test did not report success"; exit 1
          }

      - name: Stage distribution folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "package" | Out-Null
          Copy-Item -Recurse "dist/HydrogenSpectroscopy" "package/HydrogenSpectroscopy"
          @"
          Hydrogen Quantum Spectroscopy (Windows)

          1. Extract this whole ZIP (do not run the exe from inside the ZIP viewer).
          2. Open the HydrogenSpectroscopy folder and double-click HydrogenSpectroscopy.exe.
          Keep the _internal folder next to the exe - the app needs it.
          No installation or password is required.
          If Windows SmartScreen warns about an unknown publisher (the exe is unsigned),
          choose More info > Run anyway.
          "@ | Set-Content -Path "package/README_RUN.txt" -Encoding utf8

      - name: Verify the packaged copy runs from a fresh location
        shell: pwsh
        run: |
          # Zip and re-extract the staged folder exactly as a user would, then smoke-test that copy.
          Compress-Archive -Path "package/*" -DestinationPath "verify.zip"
          Expand-Archive -Path "verify.zip" -DestinationPath "verify_extracted"
          $exe = "verify_extracted/HydrogenSpectroscopy/HydrogenSpectroscopy.exe"
          $result = Join-Path $PWD "smoke_extracted.txt"
          $p = Start-Process -FilePath $exe -ArgumentList "--smoke-test", "`"$result`"" -Wait -PassThru
          if (Test-Path $result) { Get-Content $result }
          if ($p.ExitCode -ne 0) { Write-Error "Extracted-copy smoke test failed"; exit 1 }

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          # GitHub zips this folder into a standard .zip when it is downloaded.
          name: HydrogenSpectroscopy-Windows
          path: package/
          if-no-files-found: error
