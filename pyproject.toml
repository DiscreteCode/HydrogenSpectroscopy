[project]
name = "hydrogen-quantum-spectroscopy"
version = "1.0.0"
description = "Unveiling Stellar Composition Through Quantum Simulations of Hydrogen Spectral Lines -- an educational desktop app demonstrating hydrogen energy levels, spectral line formation, and hydrogen detection in stellar spectra."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26,<3.0",
    "scipy>=1.11,<2.0",
    "matplotlib>=3.8,<4.0",
    "PySide6>=6.6,<6.8",
    "pyqtgraph>=0.13,<0.14",
    "Pillow>=10.0,<13.0",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.3,<7.0"]
test = ["pytest>=8.0,<9.0", "pytest-cov>=5.0,<6.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["physics", "spectroscopy", "visualization", "app"]
